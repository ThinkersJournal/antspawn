[package]
name = "antspawn"
version = "0.0.21"
edition = "2024"
rust-version = "1.94"
description = "A sandboxed job runner: one clean environment per job, only what the job declares, outputs collected, environment destroyed. Launchers are certified by tests, never asserted."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/antspawn"
readme = "README.md"
keywords = ["sandbox", "ci", "runner", "isolation", "jobs"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "spawn"
path = "src/main.rs"

[[bin]]
name = "spawn-runner"
path = "src/bin/spawn-runner.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
ureq = "3.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }
