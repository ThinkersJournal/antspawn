name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --all-targets --locked

      - name: cargo test
        run: cargo test --locked --no-fail-fast

      - name: Committed matrix matches the probes (ubuntu leg only)
        if: runner.os == 'Linux'
        run: cargo run --locked --example matrix -- --check

  # The exe the PM installs into Program Files: built here, on a GitHub-hosted runner, never on the
  # machine that will run it. Compare the printed/uploaded sha256 with the installed file afterwards.
  runner-exe:
    name: runner-exe (spawn-runner.exe artifact)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Build spawn-runner and spawn-wfp (release)
        run: cargo build --release --locked --bin spawn-runner --bin spawn-wfp

      - name: Hash it and stage the artifact
        shell: pwsh
        run: |
          $exe = 'target/release/spawn-runner.exe'
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist/spawn-runner.exe
          "$hash  spawn-runner.exe" | Set-Content -Encoding ascii dist/spawn-runner.exe.sha256
          "sha256 $hash  size $((Get-Item $exe).Length)  commit $env:GITHUB_SHA"
          "spawn-runner.exe sha256 ``$hash`` (commit $env:GITHUB_SHA)" >> $env:GITHUB_STEP_SUMMARY
          # spawn-wfp.exe: the elevated account-boundary tool (Part A), run by the machine owner, never installed
          $wfp = 'target/release/spawn-wfp.exe'
          if (-not (Test-Path $wfp)) { throw "$wfp was not built" }
          $wfpHash = (Get-FileHash -Algorithm SHA256 $wfp).Hash
          Copy-Item $wfp dist/spawn-wfp.exe
          "$wfpHash  spawn-wfp.exe" | Set-Content -Encoding ascii dist/spawn-wfp.exe.sha256
          "sha256 $wfpHash  size $((Get-Item $wfp).Length)  commit $env:GITHUB_SHA"
          "spawn-wfp.exe sha256 ``$wfpHash`` (commit $env:GITHUB_SHA)" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spawn-runner-windows-x64
          path: dist/
          if-no-files-found: error

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Read the floor from the manifest so the job cannot drift from it.
      - name: Read rust-version
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: cargo check on the MSRV toolchain
        run: |
          rustc --version
          cargo check --all-targets --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  spdx:
    name: spdx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The gate can fail and can see files
        run: bash .github/spdx_gate.sh --self-test
      - name: Check the tree
        run: bash .github/spdx_gate.sh

  # Advisory (CireSnave 2026-10-23: "Roll out advisory-only, non-blocking CodeRipper checks everywhere."):
  # NOT a required check; findings become ROADMAP/HANDOFF rows, rules are never silenced.
  portfolio:
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@74996d75e48f6b7d79ce4f5ad51b2df9b6a9f201
